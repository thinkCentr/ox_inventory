name: Check Samuels-Development upstream
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch --no-tags https://github.com/Samuels-Development/ox_inventory.git refs/heads/main
          {
            echo '### Samuels-Development changes'
            if git merge-base HEAD FETCH_HEAD >/dev/null; then
              git log --format='%h %s' HEAD..FETCH_HEAD
            else
              echo 'No shared history. Review the upstream tree manually.'
              git log -15 --format='%h %s' FETCH_HEAD
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
