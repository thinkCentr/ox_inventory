name: Build ox_inventory
on:
  push:
    branches: ['**']
    tags: ['shift-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: bash .github/package-resource.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ox_inventory
          path: ox_inventory.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/shift-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ox_inventory
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          [[ "$TAG" =~ ^shift-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          manifest=$(unzip -p ox_inventory.zip ox_inventory/fxmanifest.lua)
          version=$(sed -n "s/^version '\([^']*\)'$/\1/p" <<< "$manifest")
          [[ -n "$version" && "$TAG" == "shift-v${version}-r"* ]]
          gh release create "$TAG" ox_inventory.zip --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Shift ox_inventory $TAG" --generate-notes \
            --notes "Inventory $version built from $GITHUB_SHA. Extract ox_inventory.zip into your FiveM resources directory."
